<style>
:root{--page:#e7e2d6;--pink:#1c2b3a;--psoft:#5f6d70;--bline:#cdbfa6;
 --bg:#f3ece0;--surf:#faf5ea;--ink:#1c2b3a;--soft:#5b6b76;--acc:#1c2b3a;--l:#d8cbb0;--lbg:#ece2cf;--sea:#d9e0da;
 --go:#2f6d4f;--warn:#a9721a;--stop:#9e3b26;--off:#8a9a93;--gold:#c08a2d;
 --disp:"Fraunces",Georgia,serif;--body:"Public Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#14181a;--pink:#e7eeee;--psoft:#93a1a2;--bline:#2b3334;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--pink);font-family:var(--body);line-height:1.5}
.wrap{max-width:420px;margin:0 auto;padding:1.4rem 16px;display:flex;flex-direction:column;align-items:center;gap:.7rem}
.mast{text-align:center}
.mast .tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--psoft);border:1px solid var(--bline);border-radius:3px;padding:3px 9px}
.mast .tag b{color:var(--go)}
.phone{width:100%;max-width:382px;background:#20292b;border-radius:38px;padding:11px;box-shadow:0 18px 40px rgba(0,0,0,.22)}
.screen{position:relative;background:var(--bg);border-radius:28px;height:770px;overflow:hidden;display:flex;flex-direction:column}
.notch{height:24px;flex:none;display:flex;align-items:center;justify-content:center}
.notch::after{content:"";width:84px;height:5px;border-radius:999px;background:rgba(0,0,0,.12)}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 15px 16px}
.toprow{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.toprow .sb{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.ibtn{width:24px;height:24px;border-radius:50%;border:1px solid var(--l);background:var(--surf);color:var(--soft);font-family:var(--disp);font-style:italic;font-size:13px;cursor:pointer}
.wqbanner{display:flex;align-items:center;gap:9px;background:#f7e2dc;border:1px solid var(--stop);border-radius:10px;padding:9px 11px;margin-bottom:9px}
.wqbanner[hidden]{display:none}
.wqbanner .i{color:var(--stop);font-size:16px;flex:none}
.wqbanner .t{flex:1;font-size:12px;color:var(--stop);font-weight:600}
.wqbanner .m{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.03em;color:var(--stop);white-space:nowrap}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wqbanner{background:#30201c}}
.hero{display:flex;align-items:center;gap:6px;justify-content:center}
.arw{background:none;border:none;color:var(--soft);font-size:22px;cursor:pointer;padding:4px 8px;line-height:1}
.hero .bname{font-family:var(--disp);font-weight:600;font-size:27px;color:var(--ink);text-align:center}
.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:2px 10px 8px}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--l);cursor:pointer}
.dots span.on{background:var(--acc)}
.midrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.verd{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.verd .d{width:9px;height:9px;border-radius:50%}
.actwrap{position:relative}
.actbtn{display:flex;align-items:center;gap:7px;background:var(--surf);border:1px solid var(--l);border-radius:7px;padding:7px 11px;font-size:13px;color:var(--ink);cursor:pointer;font-family:inherit}
.actmenu{position:absolute;right:0;top:40px;background:var(--surf);border:1px solid var(--l);border-radius:8px;overflow:hidden;z-index:5;min-width:140px;box-shadow:0 8px 20px rgba(0,0,0,.14)}
.actmenu[hidden]{display:none}
.actmenu button{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--l);padding:9px 12px;font-size:13px;color:var(--ink);cursor:pointer;font-family:inherit}
.actmenu button:last-child{border-bottom:none}
.actmenu button[aria-pressed="true"]{background:var(--lbg);font-weight:600}
.suggest{display:flex;align-items:center;gap:10px;background:var(--surf);border:1.5px solid var(--go);border-radius:12px;padding:11px;margin-bottom:12px;cursor:pointer}
.suggest[hidden]{display:none}
.suggest .s1{font-size:12.5px;color:var(--ink)}.suggest .s1 b{font-family:var(--disp);font-weight:600}
.suggest .a{margin-left:auto;color:var(--go);font-size:18px}
.chartcard{background:var(--surf);border:1px solid var(--l);border-radius:14px;padding:13px;margin-bottom:12px}
.chartcard .hl{font-family:var(--disp);font-weight:600;font-size:16px;color:var(--ink);margin-bottom:1px}
.chartcard .sl{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);margin-bottom:6px}
svg{display:block}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tile{background:var(--surf);border:1px solid var(--l);border-radius:9px;padding:9px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.tic{width:28px;height:28px;border-radius:6px;background:var(--lbg);display:flex;align-items:center;justify-content:center;color:var(--acc)}
.tic.warn{background:#f0e3cb;color:var(--warn)}.tic.stop{background:#f0d2c8;color:var(--stop)}
.tic svg{width:16px;height:16px}
.tile .tv{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--ink)}
.tile .tk{font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--soft)}
.tile .tx{font-size:9px;margin-top:-2px;color:var(--warn)}.tile .tx.ok{color:var(--go)}.tile .tx.stop{color:var(--stop)}
.tarcard{display:flex;align-items:center;gap:10px;background:var(--surf);border:1px solid var(--l);border-radius:11px;padding:10px 13px;margin-bottom:12px}
.tarcard .tl{font-family:var(--disp);font-weight:600;font-size:14px;color:var(--ink)}
.tarcard .td{font-size:10.5px;color:var(--soft)}
.tarcard .tb{margin-left:auto;font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:999px}
.tb.low{background:#dfe9df;color:var(--go)}.tb.elev{background:#f0e4cc;color:var(--warn)}
.info{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding:20px 18px;overflow-y:auto}
.info[hidden]{display:none}
.info h3{font-family:var(--disp);font-weight:600;font-size:20px;margin:0 0 3px;color:var(--ink)}
.info .lede{font-size:13px;color:var(--soft);margin:0 0 16px}
.info .close{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;border:1px solid var(--l);background:var(--surf);color:var(--ink);font-size:16px;cursor:pointer}
.srow{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--l);font-size:12.5px}
.srow .k{font-family:var(--disp);font-weight:600;color:var(--ink);min-width:92px}.srow .s{color:var(--soft);flex:1}
.srow a{color:var(--acc);font-weight:700;text-decoration:none}
.navbar{display:flex;border-top:1px solid var(--l);background:var(--surf)}
.navbar button{flex:1;background:none;border:none;padding:10px 4px 12px;font-family:var(--mono);font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.navbar button.on{color:var(--acc)}
.navbar .nd{width:5px;height:5px;border-radius:50%;background:currentColor}
.cap{font-size:12.5px;color:var(--psoft);text-align:center;max-width:380px;line-height:1.5}
.loading{padding:40px;text-align:center;color:var(--soft);font-family:var(--mono);font-size:12px}
.rkhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:4px 0 12px}
.rktitle{font-family:var(--disp);font-weight:600;font-size:22px;color:var(--ink)}
.rksub{font-family:var(--mono);font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);margin-top:2px}
.rklist{display:flex;flex-direction:column;gap:7px}
.rkrow{display:flex;align-items:center;gap:10px;background:var(--surf);border:1px solid var(--l);border-radius:11px;padding:11px 12px;cursor:pointer;text-align:left;width:100%;font-family:inherit}
.rknum{font-family:var(--mono);font-size:11px;color:var(--soft);width:15px;flex:none;text-align:center}
.rkd{width:9px;height:9px;border-radius:50%;flex:none}
.rkn{flex:1;font-family:var(--disp);font-weight:600;font-size:14px;color:var(--ink);min-width:0}
.rkc{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.02em;text-transform:uppercase;color:var(--soft);font-weight:400;margin-top:1px}
.rkv{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;text-align:right;max-width:94px}
.mapcard{background:var(--sea);border:1px solid var(--l);border-radius:14px;overflow:hidden;margin-bottom:10px}
.mplegend{display:flex;gap:16px;justify-content:center;font-size:10px;color:var(--soft)}
.mplegend span{display:flex;align-items:center;gap:5px}.mplegend i{width:9px;height:9px;border-radius:50%}
</style>

<div class="wrap">
  <div class="mast"><span class="tag">Beach Peek · <b>LIVE</b> · real SB County data</span></div>
  <div class="phone"><div class="screen">
    <div class="notch"></div>
    <div class="view" id="view"><div class="loading">Loading live conditions…</div></div>
    <div class="navbar"><button class="on"><span class="nd"></span>Home</button><button><span class="nd"></span>Rankings</button><button><span class="nd"></span>Map</button></div>
    <div class="info" id="info" hidden></div>
  </div></div>
  <p class="cap" id="cap">Live data from the Beach Peek pipeline (county water quality, Open-Meteo, NOAA, NWS). Swipe the arrows to change beach · tap the activity to change it · tap <b>i</b> for sources.</p>
</div>

<script>
function ic(n){var s='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">';
 var p={wave:'<path d="M2 13c2.2-3 4.3-3 6.5 0s4.3 3 6.5 0 4.3-3 6.5 0"/><path d="M2 18c2.2-3 4.3-3 6.5 0s4.3 3 6.5 0 4.3-3 6.5 0"/>',
  drop:'<path d="M12 3c3.8 4.6 6 7.7 6 10.5a6 6 0 0 1-12 0C6 10.7 8.2 7.6 12 3z"/>',thermo:'<path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/>',
  wind:'<path d="M3 8h9a2.5 2.5 0 1 0-2.5-2.5"/><path d="M3 12h13a2.5 2.5 0 1 1-2.5 2.5"/><path d="M3 16h7a2 2 0 1 1-2 2"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>',
  tide:'<path d="M3 9c2-2.6 4-2.6 6 0s4 2.6 6 0 4-2.6 6 0"/><path d="M3 17h18"/><path d="M3 17v-2.4M21 17v-2.4M12 17v-1.8"/>'};
 return s+(p[n]||'')+'</svg>';}

var ACTS=[{k:'hang',l:'Beach hang'},{k:'boogie',l:'Boogie'},{k:'surf',l:'Surf'},{k:'tidepool',l:'Tide pool'},{k:'paddle',l:'Paddle'}];
var BEACHES=[], idx=0, actK='hang', INDEX=null, tab='home';
function actLabel(k){return (ACTS.filter(function(a){return a.k===k;})[0]||ACTS[0]).l;}
function goodnessOf(b){ return b.water.advisory ? -1 : good(actK, cur(b)); }

function hhmm(iso){ if(!iso) return ''; var d=new Date(iso); var h=d.getHours(), m=d.getMinutes(); var ap=h>=12?'p':'a'; h=h%12||12; return h+(m?(':'+String(m).padStart(2,'0')):'')+ap; }
function nowFrac(){ var d=new Date(); return d.getHours()+d.getMinutes()/60; } // 0..24 local

// linear tide interpolation from hi/lo points
function tideNow(hilo){
  if(!hilo||!hilo.length) return {ft:null,trend:''};
  var now=Date.now(), pts=hilo.map(function(p){return {t:new Date(p.time.replace(' ','T')).getTime(),v:p.ft,type:p.type};});
  var before=null, after=null;
  for(var i=0;i<pts.length;i++){ if(pts[i].t<=now) before=pts[i]; if(pts[i].t>now){ after=pts[i]; break; } }
  if(!before) return {ft:pts[0].v, trend: pts[0].type==='low'?'rising':'falling'};
  if(!after) return {ft:before.v, trend:''};
  var f=(now-before.t)/(after.t-before.t), v=before.v+(after.v-before.v)*f;
  return {ft:+v.toFixed(1), trend: after.v>before.v?'rising':'falling', next:after};
}

// goodness (0-100) for an activity given hourly-ish conditions
function good(a, c){
  if(c.advisory && a!=='_dry') { /* in-water gated */ if(a!=='tidepool') return 6; return 10; }
  var w=c.windMph||0, wv=c.waveFt==null?2:c.waveFt, uv=c.uv||0, s=100;
  if(a==='hang'){ if(w>=12)s-=45;else if(w>=9)s-=22;else if(w>=6)s-=8; if(uv>=9)s-=18;else if(uv>=7)s-=8; if(wv>3)s-=25; return clamp(s); }
  if(a==='boogie'){ s=92; if(wv>3)s-=28; if(wv<0.6)s-=12; if(w>=12)s-=42;else if(w>=9)s-=18; return clamp(s); }
  if(a==='surf'){ s=28+(wv-1.6)*42; if(w>=14)s-=35;else if(w>=10)s-=15; return clamp(s); }
  if(a==='paddle'){ s=100-(wv-1)*24; if(w>=9)s-=42;else if(w>=6)s-=18; return clamp(s); }
  if(a==='tidepool'){ var t=c.tideFt==null?2:c.tideFt; return clamp(100-(t-0.6)*26); }
  return 50;
}
function clamp(v){return Math.max(5,Math.min(100,Math.round(v)));}
function band(v){return v>=70?'go':(v>=45?'warn':'stop');}

// current verdict text
function verdict(b,a){
  var c=cur(b);
  if(b.water.advisory) return {l:'stop',t:'Not today — water advisory'};
  var g=good(a,c), l=band(g), w=c.windMph;
  if(a==='surf'){ if(c.waveFt>=5)return{l:'go',t:'Overhead'}; if(c.waveFt>=3)return{l:'go',t:'It’s firing'}; if(c.waveFt>=1.8)return{l:'warn',t:'Cute lil rollers'}; return{l:'warn',t:'Small & soft'}; }
  if(a==='tidepool'){ var tn=tideNow(b.tide.hilo); return tn.ft!=null&&tn.ft<=1.6?{l:'go',t:'Pools are open'}:{l:'warn',t:'Pools are underwater'}; }
  if(a==='paddle') return l==='go'?{l:'go',t:'Glassy — go paddle'}:(l==='warn'?{l:'warn',t:'Getting bumpy'}:{l:'stop',t:'Too bumpy'});
  if(a==='boogie') return l==='go'?{l:'go',t:'Fun little waves'}:(l==='warn'?{l:'warn',t:w>=9?'Doable, but windy':'A bit much for kids'}:{l:'stop',t:'Blown out'});
  return l==='go'?{l:'go',t:'Easy beach day'}:(l==='warn'?{l:'warn',t:w>=9?'Doable, but windy':'A bit rough'}:{l:'stop',t:'Rough today'});
}
function cur(b){
  var tn=tideNow(b.tide.hilo);
  return { advisory:b.water.advisory, windMph:Math.round(b.wind.mph), waveFt:b.swell.heightFt, uv:Math.round(b.air.uv), tideFt:tn.ft };
}
function firstGoFor(a){ for(var i=0;i<BEACHES.length;i++){ if(i===idx)continue; if(verdict(BEACHES[i],a).l==='go'&&!BEACHES[i].water.advisory)return BEACHES[i]; } return null; }

function chart(b){
  var H=b.hourly, S=6, E=20; // 6a..8p
  var W=300,ht=96,L=14,R=12,top=6,base=66, N=E-S+1, step=(W-L-R)/(N-1);
  function X(i){return L+i*step;} function Y(v){return top+(1-v/100)*(base-top);}
  var scores=[]; for(var h=S;h<=E;h++){ scores.push(good(actK,{advisory:b.water.advisory,windMph:H.windMph[h],waveFt:H.waveFt[h],uv:H.uv[h],tideFt:null})); }
  var pts=scores.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1);});
  var area='M '+X(0).toFixed(1)+' '+base+' L '+pts.join(' L ')+' L '+X(N-1).toFixed(1)+' '+base+' Z';
  var strip='',bw=step*0.72; for(var k=0;k<N;k++)strip+='<rect x="'+(X(k)-bw/2).toFixed(1)+'" y="74" width="'+bw.toFixed(1)+'" height="6" rx="2" style="fill:var(--'+band(scores[k])+')"/>';
  var nf=nowFrac(), ni=Math.max(0,Math.min(N-1,nf-S)), nx=X(ni);
  var svg='<svg viewBox="0 0 '+W+' '+ht+'" width="100%"><path d="'+area+'" style="fill:var(--acc);opacity:.08"/>';
  svg+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"/>';
  if(nf>=S&&nf<=E){ svg+='<line x1="'+nx.toFixed(1)+'" y1="'+top+'" x2="'+nx.toFixed(1)+'" y2="70" stroke="var(--acc)" stroke-width="1" stroke-dasharray="2 3" opacity=".4"/>'; }
  svg+=strip;
  // sunrise/sunset markers
  var sr=b.sun.sunrise?new Date(b.sun.sunrise):null, ss=b.sun.sunset?new Date(b.sun.sunset):null;
  function hx(d){ var f=d.getHours()+d.getMinutes()/60; return X(Math.max(0,Math.min(N-1,f-S))); }
  if(sr){ svg+='<circle cx="'+hx(sr).toFixed(1)+'" cy="86.5" r="2.6" fill="#c08a2d"/><text x="'+(hx(sr)+5).toFixed(1)+'" y="93" style="fill:var(--soft);font-family:var(--mono);font-size:7.5px">'+hhmm(b.sun.sunrise)+'</text>'; }
  if(nf>=S&&nf<=E) svg+='<text x="'+(nx-6).toFixed(1)+'" y="93" style="fill:var(--acc);font-family:var(--mono);font-size:7.5px">now</text>';
  if(ss){ svg+='<text x="'+(hx(ss)-30).toFixed(1)+'" y="93" style="fill:var(--soft);font-family:var(--mono);font-size:7.5px">'+hhmm(b.sun.sunset)+'</text><circle cx="'+hx(ss).toFixed(1)+'" cy="86.5" r="2.6" fill="#c08a2d"/>'; }
  svg+='</svg>';
  // best window label
  var bw2=bestWindow(scores,S);
  return {svg:svg, best:bw2};
}
function bestWindow(scores,S){
  var bs=-1,bl=0,i=0; while(i<scores.length){ if(scores[i]>=70){var j=i;while(j<scores.length&&scores[j]>=70)j++; if(j-i>bl){bl=j-i;bs=i;} i=j;} else i++; }
  if(bs<0) return 'check the hours';
  var h=function(x){var hr=S+x,ap=hr>=12?'p':'a',d=hr%12||12;return d+ap;};
  return 'best '+h(bs)+'–'+h(bs+bl);
}

function render(){
  var names=['home','rankings','map'];
  document.querySelectorAll('.navbar button').forEach(function(btn,i){ btn.classList.toggle('on', names[i]===tab); });
  if(tab==='rankings') return renderRankings();
  if(tab==='map') return renderMap();
  return renderHome();
}
function renderHome(){
  var b=BEACHES[idx]; if(!b){return;} var v=verdict(b,actK), c=cur(b), tn=tideNow(b.tide.hilo);
  var updated=new Date(b.updated), ago=Math.round((Date.now()-updated)/60000);
  var ch=chart(b);
  var waterStatus=b.water.advisory?'advisory':'clean';
  var h='';
  h+='<div class="toprow"><span class="sb">◎ '+(b.air.tempF!=null?Math.round(b.air.tempF)+'° ':'')+b.name+' · updated '+(ago<60?ago+'m ago':Math.round(ago/60)+'h ago')+'</span><button class="ibtn" id="info-open">i</button></div>';
  if(b.water.advisory) h+='<div class="wqbanner"><span class="i">⚠</span><span class="t">Water advisory — stay out of the water'+(b.water.ecoli?' (E. coli '+b.water.ecoli+')':'')+'</span><span class="m">tested '+b.water.testedDaysAgo+'d ago</span></div>';
  h+='<div class="hero"><button class="arw" id="prev">‹</button><div class="bname">'+b.name+'</div><button class="arw" id="next">›</button></div>';
  h+='<div class="dots" id="dots">'+BEACHES.map(function(x,i){return '<span class="'+(i===idx?'on':'')+'" data-i="'+i+'" title="'+x.name+'"></span>';}).join('')+'</div>';
  h+='<div class="midrow"><div class="verd"><span class="d" style="background:var(--'+v.l+')"></span><span style="color:var(--'+v.l+')">'+v.t+'</span></div>';
  h+='<div class="actwrap"><button class="actbtn" id="actbtn">'+ACTS.filter(function(a){return a.k===actK;})[0].l+' ▾</button><div class="actmenu" id="actmenu" hidden>'+ACTS.map(function(a){return '<button data-k="'+a.k+'" aria-pressed="'+(a.k===actK?'true':'false')+'">'+a.l+'</button>';}).join('')+'</div></div></div>';
  // cross-suggestion
  if(v.l!=='go'){ var alt=firstGoFor(actK); if(b.water.advisory){ var a2=firstGoFor(actK); h+=a2?'<div class="suggest" data-goto="'+BEACHES.indexOf(a2)+'"><div class="s1">Advisory here — <b>'+a2.name+'</b> is clean &amp; good right now</div><span class="a">→</span></div>':''; } else if(alt){ h+='<div class="suggest" data-goto="'+BEACHES.indexOf(alt)+'"><div class="s1">Not ideal here — <b>'+alt.name+'</b> is good right now</div><span class="a">→</span></div>'; } }
  h+='<div class="chartcard"><div class="hl">'+(b.water.advisory?'Avoid the water today':(v.l==='go'?'Good to go':'Mixed today'))+'</div><div class="sl">'+ch.best+'</div>'+ch.svg+'</div>';
  // tiles
  var wq = b.water.advisory?'<div class="tx stop">advisory</div>':'<div class="tx ok">clean ✓ · '+b.water.testedDaysAgo+'d</div>';
  h+='<div class="tiles">'
   +tile('wave', b.swell.heightFt!=null?b.swell.heightFt+' ft':'—','Waves', b.swell.heightFt>3?'warn':'')
   +'<div class="tile"><div class="tic'+(b.water.advisory?' stop':'')+'">'+ic('drop')+'</div><div class="tv">'+(b.waterTemp.f!=null?Math.round(b.waterTemp.f)+'°':'—')+'</div><div class="tk">Water</div>'+wq+'</div>'
   +tile('thermo', b.air.tempF!=null?Math.round(b.air.tempF)+'°':'—','Air','')
   +tile('wind', b.wind.mph!=null?Math.round(b.wind.mph)+' mph':'—','Wind', b.wind.mph>=12?'warn':'')
   +tile('sun', b.air.uv!=null?Math.round(b.air.uv):'—','UV', b.air.uv>=7?'warn':'', b.air.uv>=7?'<div class="tx">shade</div>':'')
   +'<div class="tile"><div class="tic">'+ic('tide')+'</div><div class="tv">'+(tn.ft!=null?tn.ft+' ft':'—')+'</div><div class="tk">Tide '+(tn.trend==='rising'?'↑':'↓')+'</div></div>'
   +'</div>';
  // tar
  h+='<div class="tarcard"><div><div class="tl">Tar estimate</div><div class="td">'+b.tar.note+'</div></div><span class="tb '+(b.tar.level==='Low'?'low':'elev')+'">'+b.tar.level+'</span></div>';
  document.getElementById('view').innerHTML=h;
  wire();
}
function tile(icn,v,k,cls,tx){ return '<div class="tile"><div class="tic'+(cls?' '+cls:'')+'">'+ic(icn)+'</div><div class="tv">'+v+'</div><div class="tk">'+k+'</div>'+(tx||'')+'</div>'; }

function rkConds(b){ var p=[]; if(b.water.advisory)p.push('⚠ advisory'); if(b.swell.heightFt!=null)p.push(b.swell.heightFt+' ft'); if(b.wind.mph!=null)p.push(Math.round(b.wind.mph)+' mph'); return p.join(' · '); }
function renderRankings(){
  var rows=BEACHES.map(function(b,i){return {b:b,i:i,v:verdict(b,actK),g:goodnessOf(b)};}).sort(function(a,c){return c.g-a.g;});
  var h='<div class="rkhead"><div><div class="rktitle">Rankings</div><div class="rksub">best for '+actLabel(actK).toLowerCase()+' right now</div></div>'
    +'<div class="actwrap"><button class="actbtn" id="actbtn">'+actLabel(actK)+' ▾</button><div class="actmenu" id="actmenu" hidden>'+ACTS.map(function(a){return '<button data-k="'+a.k+'" aria-pressed="'+(a.k===actK?'true':'false')+'">'+a.l+'</button>';}).join('')+'</div></div></div>';
  h+='<div class="rklist">'+rows.map(function(r,n){var b=r.b;return '<button class="rkrow" data-i="'+r.i+'"><span class="rknum">'+(n+1)+'</span><span class="rkd" style="background:var(--'+r.v.l+')"></span><span class="rkn">'+b.name+'<span class="rkc">'+rkConds(b)+'</span></span><span class="rkv" style="color:var(--'+r.v.l+')">'+r.v.t+'</span></button>';}).join('')+'</div>';
  document.getElementById('view').innerHTML=h;
  var am=document.getElementById('actmenu');
  document.getElementById('actbtn').onclick=function(e){e.stopPropagation();am.hidden=!am.hidden;};
  am.onclick=function(e){var btn=e.target.closest('button');if(!btn)return;actK=btn.dataset.k;am.hidden=true;render();};
  document.addEventListener('click',function(){if(am)am.hidden=true;},{once:true});
  document.querySelector('.rklist').onclick=function(e){var r=e.target.closest('.rkrow');if(r){idx=+r.dataset.i;tab='home';render();}};
}
function renderMap(){
  var W=320,H=300, lons=BEACHES.map(function(b){return b.coords.lon;});
  var minL=Math.min.apply(null,lons), maxL=Math.max.apply(null,lons), span=(maxL-minL)||1;
  function X(lon){ return 26+(lon-minL)/span*(W-52); }
  function coastY(x){ return 140+24*Math.sin(x/38); }
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-height:380px">';
  var land='M0 0 H'+W+' V'+coastY(W).toFixed(1)+' '; for(var gx=W;gx>=0;gx-=16)land+='L'+gx+' '+coastY(gx).toFixed(1)+' ';
  svg+='<path d="'+land+'Z" fill="var(--bg)"/>';
  var cp=''; for(var g=0;g<=W;g+=16)cp+=(g===0?'M':'L')+g+' '+coastY(g).toFixed(1)+' ';
  svg+='<path d="'+cp+'V'+H+' H0 Z" fill="var(--sea)" opacity=".55"/><path d="'+cp+'" fill="none" stroke="var(--acc)" stroke-width="1.2" opacity=".4"/>';
  BEACHES.forEach(function(b,i){
    var x=X(b.coords.lon), y=coastY(x)+16, v=verdict(b,actK), sel=i===idx;
    svg+='<circle class="mpin" data-i="'+i+'" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(sel?7:5.5)+'" fill="var(--'+v.l+')" stroke="var(--bg)" stroke-width="'+(sel?2.5:1.5)+'" style="cursor:pointer"/>';
    if(sel) svg+='<text x="'+x.toFixed(1)+'" y="'+(y+21).toFixed(1)+'" text-anchor="middle" style="font-family:var(--disp);font-weight:600;font-size:11px;fill:var(--ink)">'+b.name+'</text>';
  });
  svg+='<text x="8" y="'+(H-8)+'" style="font-family:var(--mono);font-size:8px;fill:var(--soft)">← west</text><text x="'+(W-8)+'" y="'+(H-8)+'" text-anchor="end" style="font-family:var(--mono);font-size:8px;fill:var(--soft)">east →</text></svg>';
  var h='<div class="rkhead"><div><div class="rktitle">Your coast</div><div class="rksub">colored by '+actLabel(actK).toLowerCase()+' · tap a dot</div></div></div><div class="mapcard">'+svg+'</div>';
  h+='<div class="mplegend"><span><i style="background:var(--go)"></i>go</span><span><i style="background:var(--warn)"></i>iffy</span><span><i style="background:var(--stop)"></i>no</span></div>';
  document.getElementById('view').innerHTML=h;
  document.querySelector('.mapcard').onclick=function(e){var p=e.target.closest('.mpin');if(p){idx=+p.getAttribute('data-i');tab='home';render();}};
}

function wire(){
  var el=function(id){return document.getElementById(id);};
  if(el('prev'))el('prev').onclick=function(){idx=(idx-1+BEACHES.length)%BEACHES.length;render();};
  if(el('next'))el('next').onclick=function(){idx=(idx+1)%BEACHES.length;render();};
  el('dots').onclick=function(e){var s=e.target.closest('[data-i]');if(s){idx=+s.dataset.i;render();}};
  var am=el('actmenu');
  el('actbtn').onclick=function(e){e.stopPropagation();am.hidden=!am.hidden;};
  am.onclick=function(e){var btn=e.target.closest('button');if(!btn)return;actK=btn.dataset.k;am.hidden=true;render();};
  document.addEventListener('click',function(){if(am)am.hidden=true;},{once:true});
  var sug=document.querySelector('.suggest'); if(sug)sug.onclick=function(){idx=+sug.dataset.goto;render();};
  el('info-open').onclick=showInfo;
}
function showInfo(){
  var b=BEACHES[idx], info=document.getElementById('info');
  info.innerHTML='<button class="close" id="ic">×</button><h3>Where this comes from</h3><p class="lede">Live, real sources — nothing invented. Updated '+new Date(b.updated).toLocaleString()+'.</p>'
   +srow('Water quality', b.water.source+' — '+b.water.status+', tested '+b.water.testedDaysAgo+'d ago', 'https://www.countyofsb.org')
   +srow('Tides', 'NOAA CO-OPS '+b.tide.station, 'https://tidesandcurrents.noaa.gov')
   +srow('Swell', b.swell.source, 'https://open-meteo.com')
   +srow('Wind · UV · air', 'Open-Meteo forecast', 'https://open-meteo.com')
   +srow('Water temp', b.waterTemp.source, 'https://www.ndbc.noaa.gov')
   +srow('Rip', 'NWS alerts (zone '+(INDEX.zone)+')', 'https://www.weather.gov')
   +srow('Tar', 'Estimate — '+b.tar.note, '');
  info.hidden=false; document.getElementById('ic').onclick=function(){info.hidden=true;};
}
function srow(k,s,url){ return '<div class="srow"><span class="k">'+k+'</span><span class="s">'+s+(url?' <a href="'+url+'" target="_blank" rel="noopener">↗</a>':'')+'</span></div>'; }

// load live data
(async function(){
  var order=['leadbetter','east-beach-at-mission-creek','east-beach-at-sycamore-creek','arroyo-burro','goleta-beach','sands-at-coal-oil-point','hope-ranch','butterfly-beach','hammonds','summerland-beach','carpinteria-state'];
  function pickIds(ids){ var p=order.filter(function(id){return ids.indexOf(id)>=0;}); return p.length?p:ids; }
  try{
    if(window.BP_DATA){                                   // embedded snapshot (phone / hosted build)
      INDEX = window.BP_DATA.index;
      BEACHES = pickIds(INDEX.beaches.map(function(x){return x.id;})).map(function(id){return window.BP_DATA.beaches[id];}).filter(Boolean);
    } else {                                              // live: fetch from served out/
      INDEX = await (await fetch('out/index.json?t='+Date.now())).json();
      var pick = pickIds(INDEX.beaches.map(function(x){return x.id;}));
      BEACHES = await Promise.all(pick.map(function(id){return fetch('out/'+id+'.json?t='+Date.now()).then(function(r){return r.json();});}));
    }
    document.querySelectorAll('.navbar button').forEach(function(btn,i){ btn.onclick=function(){ tab=['home','rankings','map'][i]; render(); }; });
    idx = 0; render();
    document.getElementById('cap').innerHTML='Conditions as of '+new Date(INDEX.updated).toLocaleString()+' · '+BEACHES.length+' beaches · swipe ‹ ›, change the activity, tap <b>i</b> for sources.'+(window.BP_DATA?'<br><b>Snapshot</b> — real data from this morning, not auto-updating yet.':'');
  }catch(e){ document.getElementById('view').innerHTML='<div class="loading">Couldn\'t load data.<br>'+e.message+'</div>'; }
})();
</script>
